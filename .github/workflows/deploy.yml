name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inject API key into production environment
        env:
          NPM_API_KEY: ${{ secrets.NPM_API_KEY }}
        run: |
          node -e "const fs=require('fs'); const key=process.env.NPM_API_KEY || ''; fs.writeFileSync('src/environments/environment.prod.ts', `export const environment = {\n  production: true,\n  apiKey: ${JSON.stringify(key)}\n};\n`);"

      - name: Build Angular app
        run: npm run build -- --base-href="/${{ github.event.repository.name }}/"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/cvcreator

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
